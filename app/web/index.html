<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mini Agent</title>
  <link rel="stylesheet" href="/style.css?v=20261019-5">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">M</div>
        <div class="brand-copy">
          <h1>Mini Agent</h1>
          <p>自研 Agent Runtime</p>
        </div>
      </div>

      <div class="new-actions">
        <button class="new-session" id="new-session" type="button">
          <span aria-hidden="true">＋</span> 新建会话
        </button>
        <button
          class="new-window"
          id="new-window"
          type="button"
          title="新建会话并在新窗口打开"
          aria-label="新建会话并在新窗口打开"
        >↗</button>
      </div>

      <div class="session-list" id="session-list"></div>

      <div class="sidebar-footer">
        <span class="dot" id="health-dot"></span>
        <span id="health-text">连接中…</span>
      </div>
    </aside>

    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

    <main class="main">
      <header class="chat-header">
        <button class="menu-toggle" id="menu-toggle" type="button" aria-label="打开会话列表">☰</button>
        <div class="header-copy">
          <h2 id="session-title">未选择会话</h2>
          <p id="session-meta">从左侧新建一个会话开始</p>
        </div>
        <div class="header-badge" id="model-badge" hidden></div>
      </header>

      <div class="error-banner" id="error-banner" hidden></div>

      <section class="chat" id="chat" aria-live="polite"></section>

      <form class="composer" id="composer">
        <textarea
          id="input"
          rows="1"
          placeholder="输入任务，Enter 发送"
          autocomplete="off"
        ></textarea>
        <button class="send" id="send" type="submit" disabled>发送</button>
      </form>
    </main>
  </div>

  <script src="/app.js?v=20261019-5"></script>
</body>
</html>
